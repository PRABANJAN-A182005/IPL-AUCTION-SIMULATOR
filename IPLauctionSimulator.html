<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IPL Auction – RTM + Highest Bid</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{margin:0;background:#06172b;font-family:Arial}
.app{max-width:1400px;margin:auto;padding:12px;
display:grid;grid-template-columns:300px 1fr 300px;gap:12px}
.panel{background:#fff;border-radius:10px;padding:12px}
h2,h3{margin:0 0 8px}
.small{font-size:12px;color:#555}

.btn{padding:8px 12px;border-radius:8px;border:none;
background:#ffb400;font-weight:600;cursor:pointer}
.btn.ghost{background:#fff;border:1px solid #ccc}
.btn:disabled{opacity:.4;cursor:not-allowed}

.team{display:flex;gap:8px;align-items:center;padding:6px;border-bottom:1px solid #eee}
.team img{width:32px;height:32px;border-radius:6px}

.bid-btn{padding:6px 10px;border-radius:6px;border:1px solid #ccc;background:#fff}
.bid-btn:disabled{opacity:.4}

.player{display:flex;gap:16px}
.photo{width:180px;height:180px;background:#eee;border-radius:10px}
.photo img{width:100%;height:100%;object-fit:cover;border-radius:10px}

.price{font-size:26px;font-weight:700}
.timer{font-size:22px;color:#d71920;font-weight:700}

.log div{border-bottom:1px dashed #ddd;padding:4px 0}

.toast{
position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
background:#000;color:#fff;padding:10px;border-radius:8px;
opacity:0;transition:.3s
}
.toast.show{opacity:1}

.highest{display:flex;gap:10px;align-items:center;margin-top:6px}
.highest img{width:60px;height:60px;border-radius:8px;object-fit:cover;background:#eee}
.highest .amt{font-size:18px;font-weight:700;color:#d71920}
</style>
</head>

<body>
<div class="app">

<!-- TEAMS -->
<aside class="panel">
<h2>Teams</h2>
<div id="teams"></div>
</aside>

<!-- AUCTION -->
<main class="panel">
<h2>Auction</h2>

<div class="player">
 <div>
  <div class="photo" id="photo"></div>
  <div class="price" id="price">-</div>
  <div class="small" id="leader">-</div>
  <div class="timer" id="timer">20</div>
 </div>

 <div style="flex:1">
  <h3 id="pname"></h3>
  <div class="small" id="meta"></div>
  <h4>Bid</h4>
  <div id="bidButtons"></div>
 </div>
</div>

<div style="margin-top:10px">
 <button class="btn ghost" onclick="resetBid()">Reset Bid</button>
 <button class="btn ghost" onclick="undoBid()">Undo</button>
 <button class="btn" onclick="sell()">SELL</button>
 <button class="btn ghost" onclick="unsold()">UNSOLD</button>
</div>

<hr>
<h3>Log</h3>
<div id="log" class="log"></div>
</main>

<!-- STATUS -->
<aside class="panel">
<h3>Highest Bid</h3>
<div id="highestBidBlock" class="small">No bids yet</div>

<hr>
<h2>Status</h2>
<div class="small">Player <b id="idx"></b></div>
<div class="small">Sold <b id="sold">0</b></div>
</aside>

</div>

<div id="toast" class="toast"></div>

    prevTeam: 'PBKS',

const teamNames=['CSK','MI','RCB','KKR','GT','LSG','RR','SRH','DC','PBKS'];

/* ---------- STATE ---------- */
const state={
 i:0,
 bid:0,
 leader:null,
 last:null,
 history:[],
 sold:0,
 hasBid:false,
 step:25,
 max:25,
 os:8,
 time:20,
 timer:null,
 teams:teamNames.map(n=>({
  name:n,
  logo:`https://documents.iplt20.com/ipl/${n}/Logos/Logooutline/${n}outline.png`,
  purse:100,
  players:[],
  rtm:3
 }))
};

/* ---------- HELPERS ---------- */
const fmt=l=>l>=100?(l/100)+' Cr':l+' L';
const afford=(t,b)=>b/100<=t.purse;
const osCount=t=>t.players.filter(p=>p.country!=='India').length;
const prevTeam=p=>state.teams.find(t=>t.name===p.prevTeam);

/* ---------- TIMER ---------- */
function startTimer(){
 clearInterval(state.timer);
 state.time=20;
 $('timer').textContent=state.time;
 state.timer=setInterval(()=>{
  state.time--;
  $('timer').textContent=state.time;
  if(state.time<=0){
   clearInterval(state.timer);
   if(state.leader===null){
    log(players[state.i].name+' UNSOLD (timer)');
    next();
   }
  }
 },1000);
}

/* ---------- RENDER ---------- */
function renderTeams(){
 $('teams').innerHTML='';
 state.teams.forEach(t=>{
  $('teams').innerHTML+=`
  <div class="team">
   <img src="${t.logo}">
   <div>
    <b>${t.name}</b>
    <div class="small">
     ₹${t.purse}Cr | ${t.players.length}/25 |
     OS ${osCount(t)}/8 | RTM ${t.rtm}
    </div>
   </div>
  </div>`;
 });
}

function renderButtons(){
 $('bidButtons').innerHTML='';
 state.teams.forEach((t,i)=>{
  const dis=
   state.last===i ||
   !afford(t,state.bid+state.step) ||
   t.players.length>=state.max ||
   (players[state.i].country!=='India' && osCount(t)>=state.os);

  const b=document.createElement('button');
  b.className='bid-btn';
  b.textContent=t.name;
  b.disabled=dis;
  b.onclick=()=>bid(i);
  $('bidButtons').appendChild(b);
 });
}

function renderHighestBid(){
 const box=$('highestBidBlock');

 if(!state.hasBid || state.leader===null){
  box.innerHTML='No bids yet';
  return;
 }

 const p=players[state.i];
 const t=state.teams[state.leader];

 box.innerHTML=`
 <div class="highest">
  <img src="${p.photo}">
  <div>
   <b>${p.name}</b><br>
   ${t.name}<br>
   <span class="amt">${fmt(state.bid)}</span>
  </div>
 </div>`;
}

function update(){
 $('price').textContent=fmt(state.bid);
 $('leader').textContent=state.leader===null?'No bids':state.teams[state.leader].name;
 $('idx').textContent=state.i+1;
 $('sold').textContent=state.sold;
 renderTeams();
 renderButtons();
 renderHighestBid();
}

/* ---------- PLAYER ---------- */
function load(){
 const p=players[state.i];
 $('pname').textContent=p.name;
 $('meta').textContent=
  `${p.role} | ${p.country} | Base ${p.base}L | Prev ${p.prevTeam}`;
 $('photo').innerHTML=`<img src="${p.photo}">`;
 resetBid();
 startTimer();
}

function resetBid(){
 const p=players[state.i];
 state.bid=p.base;
 state.leader=null;
 state.last=null;
 state.history=[];
 state.hasBid=false;
 update();
}

/* ---------- BID ---------- */
function bid(i){
 if(state.last===i){toast('Same team cannot bid twice');return;}

 const t=state.teams[i];
 const next=state.bid+state.step;

 if(!afford(t,next)){toast('Insufficient purse');return;}
 if(players[state.i].country!=='India' && osCount(t)>=state.os){
  toast('Overseas quota full');return;
 }

 state.history.push({bid:state.bid,leader:state.leader,last:state.last});
 state.bid=next;
 state.leader=i;
 state.last=i;
 state.hasBid=true;

 log(`${t.name} bids ${fmt(next)}`);
 startTimer();
 update();
}

/* ---------- UNDO ---------- */
function undoBid(){
 const h=state.history.pop();
 if(!h){toast('Nothing to undo');return;}

 const prevBid=state.bid;
 const prevLeader=state.leader!==null?state.teams[state.leader].name:'No bids';

 state.bid=h.bid;
 state.leader=h.leader;
 state.last=h.last;

 if(state.history.length===0) state.hasBid=false;

 const newLeader=state.leader===null?'No bids':state.teams[state.leader].name;
 log(`Undo → ${fmt(prevBid)} (${prevLeader}) reverted to ${fmt(state.bid)} (${newLeader})`);
 update();
}

/* ---------- RTM ---------- */
function rtmFlow(prev,highest,bid,player){
 if(prev===highest||prev.rtm<=0||prev.players.length>=state.max||!afford(prev,bid))
  return {w:highest,b:bid,u:false};

 if(!confirm(`${prev.name} use RTM for ${player.name} at ${fmt(bid)}?`))
  return {w:highest,b:bid,u:false};

 const inc=Number(prompt(`${highest.name}: final raise ≥${state.step}L`));
 if(!inc||inc<state.step) return {w:prev,b:bid,u:true};

 const nb=bid+inc;
 if(!afford(highest,nb)) return {w:prev,b:bid,u:true};

 if(confirm(`${prev.name}, match ${fmt(nb)}?`))
  return {w:prev,b:nb,u:true};

 return {w:highest,b:nb,u:false};
}

/* ---------- SELL ---------- */
function sell(){
 clearInterval(state.timer);
 if(state.leader===null){toast('No bids');return;}

 const p=players[state.i];
 const highest=state.teams[state.leader];
 const prev=prevTeam(p);

 let win=highest, fb=state.bid;
 if(prev && prev!==highest){
  const r=rtmFlow(prev,highest,state.bid,p);
  win=r.w;fb=r.b;
  if(r.u){prev.rtm--;log(prev.name+' used RTM');}
 }

 win.players.push(p);
 win.purse=(win.purse-fb/100).toFixed(2);
 state.sold++;
 log(`${p.name} SOLD to ${win.name} for ${fmt(fb)}`);
 next();
}

/* ---------- FLOW ---------- */
function unsold(){
 clearInterval(state.timer);
 if(confirm('Mark UNSOLD?')){
  log(players[state.i].name+' UNSOLD');
  next();
 }
}

function next(){
 state.i++;
 if(state.i>=players.length){
  alert('Auction Completed');
  document.querySelectorAll('button').forEach(b=>b.disabled=true);
  return;
 }
 load();
}

/* ---------- INIT ---------- */
renderTeams();
load();
</script>
